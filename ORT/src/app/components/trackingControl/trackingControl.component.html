<div class="tracking-control">
  <!--TODO: Implement color for loading-->
  <ng-container *ngIf="trackingService.trackingStatus$ | async as status">
    <ion-button (click)="toggleTracking()" [color]="buttonStyles[status].color" class="tracking-button"
      [disabled]="status === 'loading'">
      {{ buttonStyles[status].text }}
    </ion-button>
  </ng-container>
</div>
